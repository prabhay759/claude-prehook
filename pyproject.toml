[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawc"
version = "0.1.0"
description = "Claude Code compression and memory hook system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Prabhay", email = "coolprabhay90@gmail.com" }]
keywords = ["claude", "claude-code", "compression", "hooks", "llm", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.3",
    "simhash>=2.1",
    "networkx>=3.3",
    "anthropic>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
toon = ["python-toon>=0.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-networkx",
]

[project.scripts]
clawc = "clawc.cli:app"

[project.urls]
Repository = "https://github.com/prabhay759/claude-prehook"
Issues = "https://github.com/prabhay759/claude-prehook/issues"

[tool.hatch.build.targets.wheel]
packages = ["clawc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=clawc --cov-report=term-missing -q"

[tool.coverage.run]
omit = ["tests/*"]
